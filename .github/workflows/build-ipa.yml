name: Build iCleanerPro iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Release arm64 App Bundle (Unsigned for Feather / ESign / Sideloadly)
        run: |
          rm -rf ./build
          mkdir -p ./build

          xcodebuild clean archive \
            -project iCleanerPro.xcodeproj \
            -scheme iCleanerPro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/iCleanerPro.xcarchive \
            ARCHS=arm64 \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > xcodebuild.log 2>&1 || {
              echo "=== XCODEBUILD FAILED ==="
              cat xcodebuild.log | grep -E "error:|fatal error:|failed|Signing" -C 3 || tail -n 60 xcodebuild.log
              exit 1
            }

          APP_BUNDLE="./build/iCleanerPro.xcarchive/Products/Applications/iCleanerPro.app"
          if [ ! -d "$APP_BUNDLE" ]; then
            echo "ERROR: iCleanerPro.app not found at $APP_BUNDLE!"
            exit 1
          fi

          mkdir -p ./build/Payload
          cp -R "$APP_BUNDLE" ./build/Payload/iCleanerPro.app

          # Verify compiled arm64 Mach-O executable exists
          file ./build/Payload/iCleanerPro.app/iCleanerPro

          # Ensure AppIcon PNGs exist for Feather / ESign preview
          if [ ! -f ./build/Payload/iCleanerPro.app/AppIcon60x60@2x.png ]; then
            sips -z 120 120 iCleanerPro/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png --out ./build/Payload/iCleanerPro.app/AppIcon60x60@2x.png
            sips -z 180 180 iCleanerPro/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png --out ./build/Payload/iCleanerPro.app/AppIcon60x60@3x.png
            sips -z 152 152 iCleanerPro/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png --out ./build/Payload/iCleanerPro.app/AppIcon76x76@2x~ipad.png
          fi

          # Apply ad-hoc Mach-O signature so Feather/ZSign can cleanly re-sign LC_CODE_SIGNATURE
          codesign --force --deep --sign - ./build/Payload/iCleanerPro.app

          (cd ./build && zip -qr iCleanerPro.ipa Payload)
          ls -lh ./build/iCleanerPro.ipa

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Upload IPA Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iCleanerPro-IPA
          path: ./build/iCleanerPro.ipa
