name: iCleanerPro
options:
  bundleIdPrefix: com.icleanerpro
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  iCleanerPro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iCleanerPro
        excludes:
          - Info.plist
          - iCleanerPro.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icleanerpro.app
        INFOPLIST_FILE: iCleanerPro/Info.plist
        CODE_SIGN_ENTITLEMENTS: iCleanerPro/iCleanerPro.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  iCleanerProTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iCleanerProTests
    dependencies:
      - target: iCleanerPro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.icleanerpro.app.tests
        GENERATE_INFOPLIST_FILE: "YES"
